name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` reruns the check when a pull request's base branch is changed.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Tool versions are pinned so a new release cannot break an unchanged commit.
# Actions are pinned to a commit, with the release it corresponds to in a
# comment, because a tag can be moved. lefthook comes from the lockfile.
env:
  BUN_VERSION: 1.4.4
  JUST_VERSION: 1.58.0
  GITLEAKS_VERSION: 8.30.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks can scan every commit reachable from the checkout.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"
          rm "${tarball}" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: just check
