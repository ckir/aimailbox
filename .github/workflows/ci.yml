name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` reruns the check when a pull request's base branch is changed.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Tool versions are pinned so a new release cannot break an unchanged commit.
env:
  BUN_VERSION: 1.4.4
  JUST_VERSION: 1.58.0
  GITLEAKS_VERSION: 8.30.1
  LEFTHOOK_VERSION: 2.1.17

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so gitleaks can scan every commit reachable from the checkout.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"
          rm "${tarball}" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"

      # The toolchain tests run the real hooks, so CI needs lefthook too.
      - name: Install lefthook
        run: |
          base="https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}"
          archive="lefthook_${LEFTHOOK_VERSION}_Linux_x86_64.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/lefthook_checksums.txt"
          grep " ${archive}\$" lefthook_checksums.txt | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/lefthook"
          gunzip -c "${archive}" > "${RUNNER_TEMP}/lefthook/lefthook"
          chmod +x "${RUNNER_TEMP}/lefthook/lefthook"
          echo "${RUNNER_TEMP}/lefthook" >> "${GITHUB_PATH}"
          rm "${archive}" lefthook_checksums.txt

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: just check
