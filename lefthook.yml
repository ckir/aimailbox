# Git hooks. Install with `just setup` (or `bun run --bun lefthook install`).
#
# These hooks are fast local feedback, not the gate: they check the working
# tree rather than the exact commit, so uncommitted or unstaged files can mask
# a problem. CI (.github/workflows/ci.yml) is authoritative.

# Run the lefthook pinned in package.json, never one that happens to be on
# PATH. Without this the generated hooks try `lefthook` on PATH first. The
# path is spelled out because `bun run lefthook` falls back to PATH when
# node_modules is missing; this form fails instead.
lefthook: bun ./node_modules/.bin/lefthook

# Sourced by each generated hook before lefthook starts. It exports git's
# hook argument as HOOK_ARG_1; see the file for why.
rc: .lefthook/rc.sh

# Fail the git operation, rather than silently skipping the hooks, when the
# lefthook binary cannot be found.
assert_lefthook_installed: true

pre-commit:
  jobs:
    # No glob: Biome decides which staged files it handles and ignores the rest,
    # so the hook covers exactly what `just lint` covers.
    - name: biome
      run: bun run --bun biome check --write --no-errors-on-unmatched --files-ignore-unknown=true -- {staged_files}
      stage_fixed: true

    - name: typecheck
      run: just typecheck

    - name: secrets
      run: just secrets-staged

commit-msg:
  jobs:
    # The message is scanned before the commit exists, so a secret typed into
    # it never enters the history. The message file's path is not passed here:
    # lefthook would paste `{1}` into a shell command unescaped. The recipe
    # reads it from HOOK_ARG_1, which .lefthook/rc.sh exports.
    - name: secrets
      run: just secrets-message

pre-push:
  jobs:
    # The fast gate, on every push. A script, not `run`: lefthook skips a
    # pre-push `run` job when the push changes no existing files (deletion-only
    # pushes, tags, empty commits). Script jobs are not skipped. The script is
    # .lefthook/pre-push/check.sh and runs `just check-fast`.
    - name: check
      script: check.sh
      runner: sh
      # Explicit args replace the remote name and URL that git passes to the
      # hook, which lefthook would otherwise append to the shell command unquoted.
      args: "--"

    # The toolchain suite takes about 12 seconds, so it runs only when the push
    # touches a file it tests. CI runs it on every change. The list must cover
    # every file the suite copies (TOOLCHAIN_FILES in tests/toolchain/helpers.ts);
    # a test there fails if it does not.
    - name: toolchain-tests
      run: just test-toolchain
      glob:
        - ".gitignore"
        - ".lefthook/**"
        - "biome.json"
        - "bun.lock"
        - "justfile"
        - "lefthook.yml"
        - "package.json"
        - "tsconfig.json"
        - "tests/toolchain/**"
